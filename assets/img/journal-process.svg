  <text class="hl" x="400" y="416" text-anchor="middle">OBSIDIAN</text>
  <text class="hs" x="400" y="436" text-anchor="middle">every step</text>
  <text class="hs" x="400" y="452" text-anchor="middle">documented</text>
</svg>
