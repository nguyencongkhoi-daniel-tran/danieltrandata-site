<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 816" width="800" height="816" role="img" aria-labelledby="t d">
  <title id="t">How work gets done</title>
  <desc id="d">A repeating cycle of eight steps: get business requirements, interpret the requirements, assess system capability, build a prototype, ask for feedback, implement, monitor, improve, and back to the start. Obsidian sits at the centre because every step is documented there.</desc>
  <style>
    .bx  { fill:#eef5fc; stroke:#1357a6; stroke-width:1.5; }
    .hub { fill:#ffffff; stroke:#dce3ea; stroke-width:1.5; }
    .st  { font:600 13.5px Inter,system-ui,sans-serif; fill:#0b2d5c; }
    .num { font:700 10px Inter,system-ui,sans-serif; fill:#1357a6; letter-spacing:.08em; }
    .hl  { font:700 10.5px Inter,system-ui,sans-serif; fill:#1357a6; letter-spacing:.11em; }
    .hs  { font:400 12px Inter,system-ui,sans-serif; fill:#4a5a6e; }
    .arc { fill:none; stroke:#0b2d5c; stroke-width:1.6; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0b2d5c"/>
    </marker>
  </defs>
  <path class="arc" d="M465.2 164.6 A252 252 0 0 1 526.0 189.8" marker-end="url(#a)"/>
  <path class="arc" d="M618.2 282.0 A252 252 0 0 1 643.4 342.8" marker-end="url(#a)"/>
  <path class="arc" d="M643.4 473.2 A252 252 0 0 1 618.2 534.0" marker-end="url(#a)"/>
  <path class="arc" d="M526.0 626.2 A252 252 0 0 1 465.2 651.4" marker-end="url(#a)"/>
  <path class="arc" d="M334.8 651.4 A252 252 0 0 1 274.0 626.2" marker-end="url(#a)"/>
  <path class="arc" d="M181.8 534.0 A252 252 0 0 1 156.6 473.2" marker-end="url(#a)"/>
  <path class="arc" d="M156.6 342.8 A252 252 0 0 1 181.8 282.0" marker-end="url(#a)"/>
  <path class="arc" d="M274.0 189.8 A252 252 0 0 1 334.8 164.6" marker-end="url(#a)"/>
  <rect class="bx" x="316.0" y="129.0" width="168" height="54" rx="9"/>
  <text class="num" x="400.0" y="144.0" text-anchor="middle">01</text>
  <text class="st" x="400.0" y="159.0" text-anchor="middle">Get business</text>
  <text class="st" x="400.0" y="175.0" text-anchor="middle">requirements</text>
  <rect class="bx" x="494.2" y="202.8" width="168" height="54" rx="9"/>
  <text class="num" x="578.2" y="217.8" text-anchor="middle">02</text>
  <text class="st" x="578.2" y="232.8" text-anchor="middle">Interpret the</text>
  <text class="st" x="578.2" y="248.8" text-anchor="middle">requirements</text>
  <rect class="bx" x="568.0" y="381.0" width="168" height="54" rx="9"/>
  <text class="num" x="652.0" y="396.0" text-anchor="middle">03</text>
  <text class="st" x="652.0" y="411.0" text-anchor="middle">Assess system</text>
  <text class="st" x="652.0" y="427.0" text-anchor="middle">capability</text>
  <rect class="bx" x="494.2" y="559.2" width="168" height="54" rx="9"/>
  <text class="num" x="578.2" y="574.2" text-anchor="middle">04</text>
  <text class="st" x="578.2" y="589.2" text-anchor="middle">Build</text>
  <text class="st" x="578.2" y="605.2" text-anchor="middle">prototype</text>
  <rect class="bx" x="316.0" y="633.0" width="168" height="54" rx="9"/>
  <text class="num" x="400.0" y="648.0" text-anchor="middle">05</text>
  <text class="st" x="400.0" y="663.0" text-anchor="middle">Ask for</text>
  <text class="st" x="400.0" y="679.0" text-anchor="middle">feedback</text>
  <rect class="bx" x="137.8" y="559.2" width="168" height="54" rx="9"/>
  <text class="num" x="221.8" y="574.2" text-anchor="middle">06</text>
  <text class="st" x="221.8" y="597.2" text-anchor="middle">Implement</text>
  <rect class="bx" x="64.0" y="381.0" width="168" height="54" rx="9"/>
  <text class="num" x="148.0" y="396.0" text-anchor="middle">07</text>
  <text class="st" x="148.0" y="419.0" text-anchor="middle">Monitor</text>
  <rect class="bx" x="137.8" y="202.8" width="168" height="54" rx="9"/>
  <text class="num" x="221.8" y="217.8" text-anchor="middle">08</text>
  <text class="st" x="221.8" y="240.8" text-anchor="middle">Improve</text>
  <circle class="hub" cx="400" cy="408" r="96"/>
